name: ssa_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^12.0.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  syncfusion_flutter_charts: ^30.2.7
  fl_chart: ^1.0.0
  path_provider: ^2.1.1
  path: ^1.9.0
  sqflite: ^2.3.2
  crypto: ^3.0.3
  intl: ^0.19.0
  go_router: ^15.1.0
  share_plus: ^10.0.0
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Testing
  mocktail: ^1.0.3
  coverage: ^1.7.2

  # Crash reporting
  firebase_crashlytics: ^4.0.0
  firebase_core: ^3.0.0

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/firmware/stasys_fw.bin
